[build-system]
requires = ["setuptools>=77.0.0", "wheel>=0.43.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["etas*"]

[tool.setuptools.package-data]
"etas.oef" = ["data/*"]

[project]
name = "etas"
version = "4.0.0"
description = "Epidemic-Type Aftershock Sequence (ETAS) model: inversion, simulation, forecasting"
readme = "README.md"
authors = [
    { name = "Leila Mizrahi", email = "leila.mizrahi@sed.ethz.ch" },
    { name = "Nicolas Schmid", email = "nicolas.schmid@sed.ethz.ch" },
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["seismology", "earthquakes", "ETAS", "aftershocks",
            "earthquake forecasting", "point process"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "geopandas",
    "joblib",
    "numpy",
    "pandas",
    "pynverse",
    "pyproj",
    "scipy",
    "Shapely>=2.0",
    "tabulate",
]

requires-python = ">=3.12"

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
test = ["pytest", "flake8", "matplotlib>=3.7"]
docs = ["mkdocs", "mkdocs-material", "mkdocstrings[python]"]
hermes = ["hermes-model>=1.0", "seismostats>=1.0"]

[project.urls]
Repository = "https://github.com/lmizrahi/etas"
Changelog = "https://github.com/lmizrahi/etas/blob/main/CHANGELOG.md"
Issues = "https://github.com/lmizrahi/etas/issues"
